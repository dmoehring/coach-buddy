<section class="page page-narrow">
  <app-page-header title="Team anlegen" backLink="/teams" backLabel="Teams" />

  @if (context.selectedSeason(); as season) {
    <p class="muted for-season">
      <i class="pi pi-calendar"></i>
      Das Team wird in der Saison <strong>{{ season.name }}</strong> angelegt.
    </p>
  } @else {
    <div class="notice notice-warn" role="alert">
      <i class="pi pi-exclamation-triangle"></i>
      <span>Wähle zuerst oben eine Saison aus.</span>
    </div>
  }

  <form class="surface form" [formGroup]="form" (ngSubmit)="createTeam()">
    @if (error()) {
      <div class="notice notice-error" role="alert">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ error() }}</span>
      </div>
    }

    <label class="field">
      <span>Name</span>
      <input pInputText type="text" formControlName="name" placeholder="z. B. F-Jugend" autocomplete="off" />

      @if (form.controls.name.touched && form.controls.name.hasError('required')) {
        <small class="field-error">Bitte gib einen Namen ein.</small>
      }
      @if (form.controls.name.touched && form.controls.name.hasError('maxlength')) {
        <small class="field-error">Der Name darf höchstens 100 Zeichen enthalten.</small>
      }
    </label>

    <label class="field">
      <span>Beschreibung</span>
      <textarea rows="3" formControlName="description" placeholder="Optional, z. B. Jahrgänge 2017–2018"></textarea>

      @if (form.controls.description.touched && form.controls.description.hasError('maxlength')) {
        <small class="field-error">Die Beschreibung darf höchstens 500 Zeichen enthalten.</small>
      }
    </label>

    <p class="muted hint">Danach weist du dem Team Spieler und Trainer zu.</p>

    <div class="form-actions">
      <button pButton type="button" severity="secondary" [outlined]="true" routerLink="/teams" [disabled]="saving()">
        Abbrechen
      </button>

      <button pButton type="submit" [loading]="saving()" [disabled]="saving() || !context.selectedSeason()">
        @if (!saving()) {
          <i class="pi pi-arrow-right"></i>
        }
        <span>Anlegen und weiter</span>
      </button>
    </div>
  </form>
</section>
