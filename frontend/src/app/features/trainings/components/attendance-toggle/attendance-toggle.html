<div class="toggle" role="group" [attr.aria-label]="'Anwesenheit ' + name()">
  @for (option of options; track option.status) {
    <button
      type="button"
      [class]="'option ' + option.tone"
      [class.selected]="status() === option.status"
      [attr.aria-pressed]="status() === option.status"
      [attr.title]="option.title"
      (click)="selected.emit(option.status)"
    >
      <i [class]="option.icon"></i>
      <span>{{ option.label }}</span>
    </button>
  }
</div>
