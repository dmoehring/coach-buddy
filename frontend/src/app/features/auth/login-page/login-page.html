<div class="login-shell">
  <form class="login-card surface" [formGroup]="form" (ngSubmit)="submit()">
    <div class="brand">
      <span class="brand-mark"><i class="pi pi-heart-fill"></i></span>
      <div>
        <h1>Coach Buddy</h1>
        <p class="muted">Melde dich an, um fortzufahren.</p>
      </div>
    </div>

    <label class="field">
      <span>Benutzername</span>
      <input pInputText type="text" formControlName="username" autocomplete="username" />
    </label>

    <label class="field">
      <span>Passwort</span>
      <input pInputText type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (error()) {
      <div class="notice notice-error" role="alert">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ error() }}</span>
      </div>
    }

    <button pButton type="submit" [disabled]="loading()" class="submit">
      <i class="pi pi-sign-in"></i>
      <span>{{ loading() ? 'Meldet an …' : 'Anmelden' }}</span>
    </button>
  </form>
</div>
