<section class="page person-create-page">
  <app-page-header title="Person anlegen" backLink="/persons" backLabel="Personen" />

  @if (error()) {
    <div class="notice notice-error" role="alert">
      <i class="pi pi-exclamation-triangle"></i>
      <span>{{ error() }}</span>
    </div>
  }

  <div class="form-grid">
    <app-person-form
      title="Neue Person"
      subtitle="Vorname, Nachname und optionale Stammdaten"
      submitLabel="Person speichern"
      [saving]="saving()"
      (submitted)="createPerson($event)"
    >
      <app-person-relations-draft
        [persons]="existingPersons()"
        [(drafts)]="relationDrafts"
      />
    </app-person-form>
  </div>
</section>
