<section class="page page-narrow">
  <app-page-header title="Neue Saison starten" backLink="/teams" backLabel="Teams" />

  @if (openSeason(); as season) {
    <div class="notice">
      <i class="pi pi-info-circle"></i>
      <span>
        Die offene Saison <strong>{{ season.name }}</strong> (seit {{ formatDisplayDate(season.startDate) }}) wird am Tag
        vor dem Start der neuen Saison beendet. Ihre Teams und Mitglieder bleiben dort erhalten – in der neuen Saison
        legst du die Teams neu an.
      </span>
    </div>
  }

  <form class="surface form" [formGroup]="form" (ngSubmit)="createSeason()">
    @if (error()) {
      <div class="notice notice-error" role="alert">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ error() }}</span>
      </div>
    }

    <label class="field">
      <span>Name</span>
      <input pInputText type="text" formControlName="name" placeholder="z. B. 2026/27" autocomplete="off" />

      @if (form.controls.name.touched && form.controls.name.hasError('required')) {
        <small class="field-error">Bitte gib einen Namen ein.</small>
      }
      @if (form.controls.name.touched && form.controls.name.hasError('maxlength')) {
        <small class="field-error">Der Name darf höchstens 100 Zeichen enthalten.</small>
      }
    </label>

    <label class="field">
      <span>Startdatum</span>
      <p-datepicker formControlName="startDate" dateFormat="dd.mm.yy" appendTo="body" [fluid]="true" />

      @if (form.controls.startDate.touched && form.controls.startDate.hasError('required')) {
        <small class="field-error">Bitte wähle ein Startdatum.</small>
      }
    </label>

    <div class="form-actions">
      <button pButton type="button" severity="secondary" [outlined]="true" routerLink="/teams" [disabled]="saving()">
        Abbrechen
      </button>

      <button pButton type="submit" [loading]="saving()" [disabled]="saving()">
        @if (!saving()) {
          <i class="pi pi-check"></i>
        }
        <span>Saison starten</span>
      </button>
    </div>
  </form>
</section>
