<div class="shell">
  <!-- Desktop sidebar -->
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard">
      <span class="brand-mark"><i class="pi pi-heart-fill"></i></span>
      <span class="brand-name">Coach Buddy</span>
    </a>

    <section class="context-box" aria-label="Saison und Mannschaft">
      <ng-container *ngTemplateOutlet="contextControls" />
    </section>

    <nav class="nav" aria-label="Hauptnavigation">
      @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active">
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="user">
        <span class="user-name">{{ session.displayName() }}</span>
      </div>

      <button
        type="button"
        class="icon-btn"
        (click)="toggleDarkMode()"
        [attr.aria-label]="darkMode() ? 'Helles Design' : 'Dunkles Design'"
      >
        <i class="pi" [class.pi-moon]="!darkMode()" [class.pi-sun]="darkMode()"></i>
      </button>

      <button type="button" class="icon-btn" (click)="logout()" aria-label="Abmelden">
        <i class="pi pi-sign-out"></i>
      </button>
    </div>
  </aside>

  <!-- Mobile top bar -->
  <header class="topbar">
    <a class="brand" routerLink="/dashboard">
      <span class="brand-mark"><i class="pi pi-heart-fill"></i></span>
    </a>

    <button
      type="button"
      class="context-chip"
      (click)="toggleSheet()"
      [attr.aria-expanded]="sheetOpen()"
      aria-controls="context-sheet"
    >
      <span class="chip-text">
        <strong>{{ context.selectedTeam()?.name ?? 'Keine Mannschaft' }}</strong>
        <small>{{ context.selectedSeason()?.name ?? 'Keine Saison' }}</small>
      </span>
      <i class="pi" [class.pi-chevron-down]="!sheetOpen()" [class.pi-chevron-up]="sheetOpen()"></i>
    </button>
  </header>

  @if (sheetOpen()) {
    <div class="sheet-backdrop" (click)="closeSheet()"></div>

    <section class="sheet" id="context-sheet" aria-label="Saison und Mannschaft wählen">
      <ng-container *ngTemplateOutlet="contextControls" />

      <div class="sheet-actions">
        <span class="user-name">{{ session.displayName() }}</span>

        <button type="button" class="icon-btn" (click)="toggleDarkMode()" aria-label="Design wechseln">
          <i class="pi" [class.pi-moon]="!darkMode()" [class.pi-sun]="darkMode()"></i>
        </button>

        <button type="button" class="icon-btn" (click)="logout()" aria-label="Abmelden">
          <i class="pi pi-sign-out"></i>
        </button>
      </div>
    </section>
  }

  <main class="content">
    <router-outlet />
  </main>

  <!-- Mobile tab bar -->
  <nav class="tabbar" aria-label="Hauptnavigation">
    @for (item of navItems; track item.route) {
      <a [routerLink]="item.route" routerLinkActive="active">
        <i [class]="item.icon"></i>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</div>

<ng-template #contextControls>
  <label class="context-field">
    <span>Saison</span>

    <p-select
      #seasonSelect
      [options]="context.seasons()"
      [ngModel]="context.selectedSeason()"
      (ngModelChange)="context.selectSeason($event)"
      [disabled]="context.loadingSeasons()"
      optionLabel="name"
      placeholder="Saison auswählen"
      appendTo="body"
      [fluid]="true"
    >
      <ng-template pTemplate="footer">
        <div class="select-footer">
          <button
            pButton
            type="button"
            severity="secondary"
            [text]="true"
            routerLink="/seasons/new"
            (click)="seasonSelect.hide(); closeSheet()"
          >
            <i class="pi pi-plus"></i>
            <span>Neue Saison starten</span>
          </button>
        </div>
      </ng-template>
    </p-select>
  </label>

  <label class="context-field">
    <span>Mannschaft</span>

    <p-select
      [options]="context.teamsForSelectedSeason()"
      [ngModel]="context.selectedTeam()"
      (ngModelChange)="context.selectTeam($event)"
      [disabled]="context.loadingTeams() || !context.selectedSeason()"
      optionLabel="name"
      placeholder="Mannschaft auswählen"
      appendTo="body"
      [fluid]="true"
    />
  </label>
</ng-template>
