# Postgres is not part of this stack: the backend connects to the shared
# instance from deploy/postgres via the external "db" network.
# For local development use docker-compose.dev.yml instead.
services:
  backend:
    build:
      context: ./backend
    image: ghcr.io/dmoehring/coach-buddy-backend:latest
    container_name: coach-buddy-backend
    restart: unless-stopped

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./backend/src/main/resources/privateKey.pem:/deployments/keys/privateKey.pem:ro

    networks:
      - default
      - db

  frontend:
    build:
      context: ./frontend
    image: ghcr.io/dmoehring/coach-buddy-frontend:latest
    container_name: coach-buddy-frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-80}:80"

    depends_on:
      - backend

networks:
  db:
    external: true
    name: db